<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>

</head><body>
<span style="font-family:'Plus Jakarta Sans';position:absolute;opacity:0">Aa1</span>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { scenes } from './scenes.js';
const q = new URLSearchParams(location.search);
const name = q.get('scene'), w = +q.get('w'), h = +q.get('h');
const nodof = q.has('nodof');
try {
  await document.fonts.load('500 40px "Plus Jakarta Sans"');
  await document.fonts.load('400 40px "Plus Jakarta Sans"');
  window.__font = new FontLoader().parse(await (await fetch('./node_modules/three/examples/fonts/helvetiker_bold.typeface.json')).json());
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(w, h);
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.toneMapping = THREE.NoToneMapping; renderer.toneMappingExposure = +(q.get('exp') || 1.0);
  document.body.appendChild(renderer.domElement);
  const t0 = performance.now();
  const { scene, camera, dof, bloom } = scenes[name](renderer, w, h);
  const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
  const composer = new EffectComposer(renderer, rt);
  composer.addPass(new RenderPass(scene, camera));
  if (dof && !nodof) composer.addPass(new BokehPass(scene, camera, dof));
  if (bloom) composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), bloom.strength, bloom.radius, bloom.threshold));
  composer.addPass(new OutputPass());
  composer.render();
  renderer.getContext().finish();
  window.__info = { ms: Math.round(performance.now() - t0), counts: window.__counts };
  window.__done = true;
} catch (e) { window.__err = String(e && e.stack || e); window.__done = true; }
</script></body></html>
